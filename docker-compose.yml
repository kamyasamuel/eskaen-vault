services:
  vault:
    build: .
    container_name: eskaen-vault
    restart: unless-stopped
    ports:
      - 3001:3001
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - SUPER_ADMIN_KEY=${SUPER_ADMIN_KEY}
      - TOKEN_EXPIRY_HOURS=24
      - NODE_ENV=production
    volumes:
      - vault_data:/app/backend/uploads
      - vault_db:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "require(\"http\").get(\"http://127.0.0.1:3001/api/stats\", (res) => process.exit(res.statusCode >= 200 && res.statusCode < 500 ? 0 : 1)).on(\"error\", () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vault_data:
  vault_db:
