<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eskaen Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
/* ============================================
   Eskaen Vault - Minimalist Modern Theme
   ============================================ */
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a28;
  --bg-card-hover: #222235;
  --bg-input: #16161f;
  --border-color: #2a2a40;
  --border-hover: #3a3a55;
  --text-primary: #f0f0f5;
  --text-secondary: #8888aa;
  --text-muted: #555577;
  --accent: #6c5ce7;
  --accent-hover: #7c6df7;
  --accent-glow: rgba(108, 92, 231, 0.15);
  --accent-subtle: rgba(108, 92, 231, 0.08);
  --green: #00d68f;
  --green-bg: rgba(0, 214, 143, 0.1);
  --red: #ff6b6b;
  --red-bg: rgba(255, 107, 107, 0.1);
  --yellow: #ffd93d;
  --yellow-bg: rgba(255, 217, 61, 0.1);
  --blue: #54a0ff;
  --blue-bg: rgba(84, 160, 255, 0.1);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 4px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
  --transition: 0.2s ease;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }

/* ===== LAYOUT ===== */
#app { min-height: 100vh; display: flex; flex-direction: column; }

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.app-header .logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.app-header .logo svg { width: 32px; height: 32px; }

.app-header .logo span { background: linear-gradient(135deg, var(--accent), #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.header-right { display: flex; align-items: center; gap: 16px; }

.role-badge {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.role-badge.super_admin { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(255, 217, 61, 0.2); }
.role-badge.admin { background: var(--accent-subtle); color: var(--accent); border: 1px solid rgba(108, 92, 231, 0.2); }
.role-badge.editor { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(84, 160, 255, 0.2); }
.role-badge.viewer { background: var(--green-bg); color: var(--green); border: 1px solid rgba(0, 214, 143, 0.2); }

.main-content {
  flex: 1;
  padding: 32px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

/* ===== AUTH SCREEN ===== */
.auth-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background: radial-gradient(ellipse at top, var(--bg-card) 0%, var(--bg-primary) 70%);
}

.auth-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 48px 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow);
}

.auth-card .logo-big {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.auth-card .logo-big span { background: linear-gradient(135deg, var(--accent), #a29bfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.auth-card .subtitle {
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 32px;
}

.auth-card .input-group {
  margin-bottom: 20px;
}

.auth-card label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.auth-card input {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font);
  transition: var(--transition);
  outline: none;
}

.auth-card input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.auth-card input::placeholder { color: var(--text-muted); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: var(--transition);
  border: none;
  outline: none;
  text-decoration: none;
}

.btn-primary {
  background: var(--accent);
  color: white;
  width: 100%;
  padding: 14px;
}

.btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }

.btn-secondary {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
}

.btn-secondary:hover { border-color: var(--text-muted); color: var(--text-primary); }

.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255, 107, 107, 0.2); }
.btn-danger:hover { background: rgba(255, 107, 107, 0.2); }
.btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 50%; background: transparent; color: var(--text-secondary); border: 1px solid var(--border-color); }
.btn-icon:hover { border-color: var(--text-muted); color: var(--text-primary); }

.error-msg {
  background: var(--red-bg);
  color: var(--red);
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
  border: 1px solid rgba(255, 107, 107, 0.2);
}

.error-msg.show { display: block; }

/* ===== DASHBOARD ===== */
.dashboard-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
}

.dashboard-header h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.dashboard-header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 20px;
  transition: var(--transition);
}

.stat-card:hover { border-color: var(--border-hover); }

.stat-card .stat-icon { font-size: 24px; margin-bottom: 12px; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
.stat-card .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 4px;
  border: 1px solid var(--border-color);
  overflow-x: auto;
}

.tab {
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  color: var(--text-secondary);
  border: none;
  background: none;
  font-family: var(--font);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}

.tab:hover { color: var(--text-primary); }
.tab.active { background: var(--accent); color: white; }

/* ===== DOCUMENTS ===== */
.documents-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 8px 16px;
  flex: 1;
  max-width: 400px;
}

.search-bar i { color: var(--text-muted); font-size: 14px; }
.search-bar input {
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font);
  width: 100%;
}
.search-bar input::placeholder { color: var(--text-muted); }

.category-filter select {
  padding: 8px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font);
  outline: none;
  cursor: pointer;
}
.category-filter select:focus { border-color: var(--accent); }

.documents-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

.doc-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 20px;
  transition: var(--transition);
  cursor: pointer;
  position: relative;
}

.doc-card:hover { border-color: var(--border-hover); background: var(--bg-card-hover); transform: translateY(-2px); }

.doc-card .doc-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin-bottom: 12px;
  background: var(--accent-subtle);
  color: var(--accent);
}

.doc-card .doc-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.doc-card .doc-desc {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.doc-card .doc-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  padding-top: 12px;
  border-top: 1px solid var(--border-color);
}

.doc-card .doc-category {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  background: var(--accent-subtle);
  color: var(--accent);
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 64px 24px;
  color: var(--text-secondary);
}

.empty-state i { font-size: 48px; margin-bottom: 16px; color: var(--text-muted); }
.empty-state h3 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
.empty-state p { font-size: 14px; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 24px;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
}

.modal-header h2 { font-size: 18px; font-weight: 600; }
.modal-header .close-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 20px; padding: 4px; }
.modal-header .close-btn:hover { color: var(--text-primary); }

.modal-body { padding: 24px; }

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: var(--transition);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group select option { background: var(--bg-card); }

/* ===== TOKENS TABLE ===== */
.table-container { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  text-align: left;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
}

tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-primary);
}

tbody tr:hover { background: var(--bg-card-hover); }

.token-key-display {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  background: var(--bg-input);
  padding: 8px 12px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border-color);
  word-break: break-all;
  margin-bottom: 8px;
  color: var(--yellow);
  user-select: all;
}

.copy-btn {
  background: var(--accent-subtle);
  color: var(--accent);
  border: none;
  padding: 6px 12px;
  border-radius: var(--radius-xs);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--font);
  transition: var(--transition);
}

.copy-btn:hover { background: var(--accent-glow); }

.status-badge {
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}

.status-badge.active { background: var(--green-bg); color: var(--green); }
.status-badge.expired { background: var(--red-bg); color: var(--red); }

/* ===== ACTIVITY LOG ===== */
.activity-list { display: flex; flex-direction: column; gap: 8px; }

.activity-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 13px;
}

.activity-item .activity-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

.activity-item .activity-detail { flex: 1; }
.activity-item .activity-time { font-size: 11px; color: var(--text-muted); }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .app-header { padding: 12px 16px; }
  .main-content { padding: 16px; }
  .auth-card { padding: 32px 24px; }
  .documents-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .dashboard-header { flex-direction: column; align-items: flex-start; }
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 12px 20px;
  font-size: 13px;
  box-shadow: var(--shadow);
  z-index: 2000;
  display: none;
  animation: slideUp 0.3s ease;
  max-width: 400px;
}

.toast.show { display: flex; align-items: center; gap: 8px; }
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--red); }

@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ===== FILE INPUT UPLOAD AREA ===== */
.upload-area {
  border: 2px dashed var(--border-color);
  border-radius: var(--radius-sm);
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
}

.upload-area:hover, .upload-area.dragover { border-color: var(--accent); background: var(--accent-glow); }
.upload-area i { font-size: 32px; color: var(--text-muted); margin-bottom: 8px; }
.upload-area p { font-size: 13px; color: var(--text-secondary); }
.upload-area .file-name { font-size: 12px; color: var(--accent); margin-top: 8px; }

/* ===== LOADING ===== */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
  color: var(--text-secondary);
}

.spinner { animation: spin 1s linear infinite; }

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

<body>
  <div id="app"></div>
  <script>
/* ============================================
   Eskaen Vault - Frontend Application
   Minimalist, modern document management
   ============================================ */

const API_BASE = window.location.origin === 'http://localhost:5500' || window.location.origin === 'http://127.0.0.1:5500'
  ? 'http://localhost:3001'
  : '';

let state = {
  token: null,
  tokenData: null,
  documents: [],
  categories: [],
  tokens: [],
  activity: [],
  stats: {},
  currentTab: 'documents',
  currentCategory: '',
  searchQuery: ''
};

// ===== UTILITY FUNCTIONS =====
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
  
  if (options.body instanceof FormData) {
    delete headers['Content-Type'];
  } else if (options.body && typeof options.body === 'object') {
    options.body = JSON.stringify(options.body);
  }

  return fetch(`${API_BASE}${path}`, {
    ...options,
    headers
  }).then(async r => {
    const data = r.headers.get('content-type')?.includes('application/json') ? await r.json() : await r.text();
    if (!r.ok) throw new Error(data.error || data.message || `HTTP ${r.status}`);
    return data;
  });
}

function formatSize(bytes) {
  if (!bytes) return '0 B';
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return `${(bytes / Math.pow(1024, i)).toFixed(1)} ${sizes[i]}`;
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'Just now';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
  if (diff < 604800000) return `${Math.floor(diff / 86400000)}d ago`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateFull(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr).toLocaleDateString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}

function isExpired(dateStr) {
  return new Date(dateStr) < new Date();
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast') || createToast();
  toast.className = `toast show ${type}`;
  toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
}

function createToast() {
  const toast = document.createElement('div');
  toast.id = 'toast';
  document.body.appendChild(toast);
  return toast;
}

function showLoading(show = true) {
  let el = document.getElementById('loading-overlay');
  if (!show && el) { el.remove(); return; }
  if (show && !el) {
    el = document.createElement('div');
    el.id = 'loading-overlay';
    el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:9999;';
    el.innerHTML = '<i class="fas fa-spinner spinner" style="font-size:32px;color:var(--accent)"></i>';
    document.body.appendChild(el);
  }
}

function modal(title, bodyHtml, footerHtml = '') {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay show';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h2>${title}</h2>
        <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  if (overlay) overlay.remove();
}

async function handleLogin() {
  const key = document.getElementById('api-key-input').value.trim();
  const errorEl = document.getElementById('auth-error');
  
  if (!key) {
    errorEl.textContent = 'Please enter your API key';
    errorEl.classList.add('show');
    return;
  }

  showLoading(true);
  try {
    const result = await api('/api/auth/login', {
      method: 'POST',
      body: { api_key: key }
    });
    
    state.token = result.token;
    state.tokenData = result;
    
    // Store in session
    sessionStorage.setItem('vault_token', result.token);
    sessionStorage.setItem('vault_token_name', result.token_name);
    sessionStorage.setItem('vault_role', result.role);
    
    showToast(`Authenticated as ${result.token_name}`);
    await initDashboard();
  } catch (err) {
    errorEl.textContent = err.message || 'Authentication failed';
    errorEl.classList.add('show');
  } finally {
    showLoading(false);
  }
}

async function loadDocuments() {

async function downloadDoc(docId) {
  try {
    const response = await fetch(`${API_BASE}/api/documents/${docId}/download`, {
      headers: { 'Authorization': `Bearer ${state.token}` }
    });
    if (!response.ok) throw new Error('Download failed');
    
    const blob = await response.blob();
    const disposition = response.headers.get('Content-Disposition');
    const filename = disposition ? disposition.split('filename=')[1]?.replace(/"/g, '') : 'document';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Download started');
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function deleteDoc(docId) {
  if (!confirm('Are you sure you want to archive this document?')) return;
  try {
    await api(`/api/documents/${docId}`, { method: 'DELETE' });
    closeModal();
    showToast('Document archived');
    await loadDocuments();
    renderDocuments(document.getElementById('tab-content'));
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function showUploadModal() {
  const cats = state.categories;
  
  modal('Upload Document', `
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="upload-title" placeholder="Document title" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="upload-desc" placeholder="Brief description..."></textarea>
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="upload-category">
        <option value="">Select category...</option>
        ${cats.map(c => `<option value="${c.slug}">${c.name}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>File</label>
      <div class="upload-area" id="upload-area">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>Click or drag a file here</p>
        <div class="file-name" id="file-name"></div>
        <input type="file" id="file-input" style="display:none" />
      </div>
    </div>
  `, `
    <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary btn-sm" onclick="handleUpload()"><i class="fas fa-upload"></i> Upload</button>
  `);

  const area = document.getElementById('upload-area');
  const fileInput = document.getElementById('file-input');
  
  area.addEventListener('click', () => fileInput.click());
  area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
  area.addEventListener('dragleave', () => area.classList.remove('dragover'));
  area.addEventListener('drop', e => {
    e.preventDefault();
    area.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      document.getElementById('file-name').textContent = e.dataTransfer.files[0].name;
    }
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
      document.getElementById('file-name').textContent = fileInput.files[0].name;
    }
  });
}

async function handleUpload() {
  const title = document.getElementById('upload-title').value.trim();
  const desc = document.getElementById('upload-desc').value.trim();
  const category = document.getElementById('upload-category').value;
  const fileInput = document.getElementById('file-input');
  
  if (!title) { showToast('Title is required', 'error'); return; }
  if (!category) { showToast('Category is required', 'error'); return; }
  if (!fileInput.files.length) { showToast('Please select a file', 'error'); return; }

  showLoading(true);
  try {
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('title', title);
    formData.append('description', desc);
    formData.append('category', category);
    
    await api('/api/documents', {
      method: 'POST',
      body: formData
    });
    
    closeModal();
    showToast('Document uploaded successfully');
    await loadDocuments();
    await loadStats();
    renderDocuments(document.getElementById('tab-content'));
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    showLoading(false);
  }
}

      </select>
    </div>
    <div class="form-group">
      <label>Expiry (hours)</label>
      <input type="number" id="token-hours" value="24" min="1" max="87600" />
      <small style="color:var(--text-muted);font-size:11px">Default: 24 hours. Max: 10 years (87600h).</small>
    </div>
    <div id="new-token-result" style="display:none">
      <div style="padding:12px;background:var(--yellow-bg);border:1px solid rgba(255,217,61,0.2);border-radius:var(--radius-sm);margin-top:8px">
        <p style="color:var(--yellow);font-size:12px;font-weight:600;margin-bottom:8px"><i class="fas fa-exclamation-triangle"></i> SAVE THIS KEY NOW — IT WILL NOT BE SHOWN AGAIN</p>
        <div class="token-key-display" id="token-raw-key"></div>
        <button class="copy-btn" onclick="copyTokenKey()"><i class="fas fa-copy"></i> Copy to clipboard</button>
      </div>
    </div>
  `, `
    <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary btn-sm" id="create-token-btn" onclick="handleCreateToken()"><i class="fas fa-plus"></i> Create</button>
  `);
}

async function handleCreateToken() {
  const name = document.getElementById('token-name').value.trim();
  const role = document.getElementById('token-role').value;
  const hours = parseInt(document.getElementById('token-hours').value) || 24;
  
  if (!name) { showToast('Token name is required', 'error'); return; }
  
  const btn = document.getElementById('create-token-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Creating...';
  
  try {
    const result = await api('/api/tokens', {
      method: 'POST',
      body: { name, role, expiry_hours: hours }
    });
    
    // Show the key
    document.getElementById('new-token-result').style.display = 'block';
    document.getElementById('token-raw-key').textContent = result.raw_key;
    document.getElementById('create-token-btn').style.display = 'none';
    
    showToast('Token created successfully');
    
    // Refresh token list
    await loadTokens();
  } catch (err) {
    showToast(err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-plus"></i> Create';
  }
}

function copyTokenKey() {
  const key = document.getElementById('token-raw-key').textContent;
  navigator.clipboard.writeText(key).then(() => {
    showToast('Key copied to clipboard');
  });
}

async function revokeToken(tokenId) {
  if (!confirm('Are you sure you want to revoke this token? This cannot be undone.')) return;
  try {
    await api(`/api/tokens/${tokenId}`, { method: 'DELETE' });
    showToast('Token revoked');
    await loadTokens();
    renderTokens(document.getElementById('tab-content'));
  } catch (err) {
    showToast(err.message, 'error');
  }
}

async function extendToken(tokenId) {
  const hours = prompt('Extend by how many hours?', '24');
  if (!hours || isNaN(hours)) return;
  try {
    await api(`/api/tokens/${tokenId}/extend`, {
      method: 'PATCH',
      body: { hours: parseInt(hours) }
    });
    showToast(`Token extended by ${hours}h`);
    await loadTokens();
    renderTokens(document.getElementById('tab-content'));
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// ===== ACTIVITY =====
function renderActivity(container) {
  container.innerHTML = state.activity.length === 0 ? `
    <div class="empty-state">
      <i class="fas fa-history"></i>
      <h3>No activity yet</h3>
      <p>Actions performed in the vault will appear here.</p>
    </div>
  ` : `
    <div class="activity-list">
      ${state.activity.map(log => {
        const iconMap = {
          'login': '🔑', 'upload': '📤', 'download': '📥', 'update': '✏️',
          'archive': '🗂️', 'token_created': '🔐', 'token_revoked': '🔒'
        };
        return `
          <div class="activity-item">
            <div class="activity-icon" style="background:var(--accent-subtle);color:var(--accent)">${iconMap[log.action] || '📋'}</div>
            <div class="activity-detail">
              <strong>${log.action.replace('_', ' ')}</strong>
              <div style="font-size:12px;color:var(--text-secondary)">${log.details || ''}</div>
              <div style="font-size:11px;color:var(--text-muted)">by ${log.token_name || 'system'} · ${formatDateFull(log.created_at)}</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// ===== TAB SWITCHING =====
async function switchTab(tab) {
  state.currentTab = tab;
  
  if (tab === 'tokens') await loadTokens();
  if (tab === 'activity') await loadActivity();
  
  renderDashboard();
}

// ===== LOGOUT =====
function handleLogout() {
  state.token = null;
  state.tokenData = null;
  sessionStorage.clear();
  showAuth();
}

// ===== INIT =====
async function init() {
  const storedToken = sessionStorage.getItem('vault_token');
  if (storedToken) {
    state.token = storedToken;
    state.tokenData = {
      token_name: sessionStorage.getItem('vault_token_name') || 'User',
      role: sessionStorage.getItem('vault_role') || 'viewer'
    };
    try {
      await initDashboard();
      return;
    } catch (e) {
      sessionStorage.clear();
    }
  }
  showAuth();
}

document.addEventListener('DOMContentLoaded', init);

  </script>
</body>
</html>
